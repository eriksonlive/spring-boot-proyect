spring.application.name=energias-renovables
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3309/mi_basedatos?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

spring.docker.compose.enabled=false

# Dialecto de MySQL
# Asegurar que usa MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuración de Hibernate (opcional)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Para que no se conecte a un contenedor de Docker
spring.datasource.hikari.maximum-pool-size=10

